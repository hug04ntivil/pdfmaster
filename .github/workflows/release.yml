name: Publicar versión

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test
      - name: Crear el release primero (evita entradas duplicadas al subir los archivos)
        shell: bash
        run: gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "PDF Master ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar y publicar instalador
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
