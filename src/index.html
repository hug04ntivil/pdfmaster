<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'wasm-unsafe-eval' blob:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data:; worker-src 'self' app: blob:; connect-src 'self' app: blob: data:; object-src 'none'; base-uri 'none'">
<title>PDF Master</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="pdf_viewer.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><span>PDF Master</span></div>
    <div id="tabs" role="tablist"></div>
    <button id="btn-newtab" class="icon-btn" title="Abrir PDF (Ctrl+O)"></button>
    <div class="tb-spacer"></div>
  </header>

  <div id="toolbar">
    <div class="tg" id="tg-file"></div>
    <div class="tg" id="tg-history"></div>
    <div class="tg" id="tg-zoom"></div>
    <div class="tg" id="tg-nav"></div>
    <div class="tg search" id="tg-search"></div>
    <div class="tb-spacer"></div>
    <div class="tg" id="tg-app"></div>
  </div>

  <div id="main">
    <aside id="left">
      <div class="side-head"><span>Páginas</span><div id="thumb-actions"></div></div>
      <div id="thumbs"></div>
    </aside>
    <section id="center">
      <div id="viewer-scroll"><div id="viewer"></div></div>
      <div id="welcome"></div>
      <div id="dropzone"><div><strong>Suelta tus archivos aquí</strong><span>PDF o imágenes</span></div></div>
    </section>
    <aside id="right">
      <div class="side-head"><span id="right-title">Herramientas</span></div>
      <div id="tool-search-wrap"></div>
      <div id="props"></div>
      <div id="tools"></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="st-msg">Listo</span>
    <span class="tb-spacer"></span>
    <span id="st-doc"></span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<div id="ctxmenu" hidden></div>
<div id="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busy-text">Procesando…</div><div class="bar"><i id="busy-bar"></i></div></div></div>
<div id="print-root"></div>
<script type="module" src="renderer.js"></script>
</body>
</html>
